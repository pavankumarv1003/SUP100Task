<!DOCTYPE html>
<html>
<head>
  <title>My First Styled Page</title>
  <style>
    body {
      background-color: #d5d35f;
      font-family: Georgia, serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: purple;
    }

    .sidebar {
      float: left;
      width: 150px;
      margin-right: 20px;
    }

    .sidebar a {
      display: block;
      padding: 5px;
      margin: 5px 0;
      background-color: white;
      color: blue;
      text-decoration: none;
      border-left: 10px solid black;
    }

    .content {
      overflow: auto;
    }

    .footer {
      margin-top: 40px;
      font-style: italic;
      font-size: 0.9em;
      color: #444;
    }

    hr {
      margin-top: 30px;
    }
  </style>
</head>
<body>
<h1>CSS:Task 6</h1>
  <div class="sidebar">
    <a href="#">Home page</a>
    <a href="#">Musings</a>
    <a href="#">My town</a>
    <a href="#">Links</a>
  </div>

  <div class="content">
    <h1>My first styled page</h1>
    <p>Welcome to my styled page!</p>
    <p>It lacks images, but at least it has style. And it has links, even if they don’t go anywhere...</p>
    <p>There should be more here, but I don’t know what yet.</p>

    <hr>

    <p class="footer">
      Made 5 April 2004<br>
      by myself.
    </p>
  </div>

</body>
</html>
