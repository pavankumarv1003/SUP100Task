<!DOCTYPE html>
<html>
<head>
  <title>Hoverable Sidenav Buttons</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Container for the entire sidenav */
    .sidenav {
      height: 100%;
      width: 60px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #f1f1f1;
    }

    /* Style for each button */
    .sidenav a {
      position: absolute;
      left: 0;
      transition: 0.3s;
      padding: 15px;
      width: 60px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      border-radius: 0 5px 5px 0;
    }

    .sidenav a:hover {
      width: 200px;
    }

    /* Individual button colors and positions */
    #green {
      top: 20px;
      background-color: #04AA6D;
    }

    #blue {
      top: 80px;
      background-color: #2196F3;
    }

    #red {
      top: 140px;
      background-color: #f44336;
    }

    #gray {
      top: 200px;
      background-color: #555;
    }

    /* Main content area */
    .main {
      margin-left: 70px;
      padding: 20px;
      border: 1px solid black;
    }
  </style>
</head>
<body>

<div class="sidenav">
  <a href="#" id="green">Green</a>
  <a href="#" id="blue">Blue</a>
  <a href="#" id="red">Red</a>
  <a href="#" id="gray">Gray</a>
</div>

<div class="main">
  <h2>Hoverable Sidenav Buttons</h2>
  <p>Hover over the buttons in the left side navigation to open them.</p>
</div>

</body>
</html>
